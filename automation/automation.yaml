# 每个功能目录仅保留同名 Compose 文件；密钥由根 .env 注入。
name: homelab_maintenance

services:
  watchtower:
    command: null
    container_name: watchtower
    deploy:
      resources:
        limits:
          memory: '33554432'
      placement: {}
    entrypoint: null
    environment:
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_DEBUG: 'false'
      WATCHTOWER_INCLUDE_RESTARTING: 'true'
      WATCHTOWER_LIFECYCLE_HOOKS: 'false'
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_REPORT: 'true'
      WATCHTOWER_NOTIFICATION_TEMPLATE: '{{- if .Report -}}[NAS][Watchtower][容器更新] 扫描 {{len .Report.Scanned}} 个，更新 {{len .Report.Updated}}
        个，失败 {{len .Report.Failed}} 个{{- range .Report.Updated }}{{println}}更新：{{.Name}}{{end}}{{- range .Report.Failed }}{{println}}失败：{{.Name}}{{end}}{{-
        else -}}{{range .Entries}}{{.Message}}{{println}}{{end}}{{- end -}}'
      WATCHTOWER_NOTIFICATION_TITLE_TAG: NAS
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:?请在根 .env 中设置 WATCHTOWER_NOTIFICATION_URL}
      WATCHTOWER_SCHEDULE: 0 0 4 * * *
    image: containrrr/watchtower:latest
    networks:
      homelab_maintenance_default: null
    restart: unless-stopped
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      bind:
        create_host_path: true

networks:
  homelab_maintenance_default:
    name: homelab_maintenance_default
    external: true

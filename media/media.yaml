# 每个功能目录仅保留同名 Compose 文件；密钥由根 .env 注入。
name: homelab_application

services:
  ani-rss:
    command: null
    container_name: ani-rss
    deploy:
      resources:
        limits:
          memory: '268435456'
      placement: {}
    entrypoint: null
    environment:
      CONFIG: /config
      JAVA_OPTS: -Xms64m -Xmx512m -Xss256k -XX:+UseG1GC -Djdk.tls.namedGroups=X25519,secp256r1,secp384r1
      PGID: '100'
      PUID: '1026'
      SERVER_PORT: '9097'
      TZ: Asia/Shanghai
    image: sha256:ca89f8ce6d81b0fa5aebd459e1ee53c46bdc024fa1c934928f59dba48a3b3fcb
    networks:
      homelab_application_default: null
      qb_control: null
    ports:
    - mode: ingress
      target: 9097
      published: '6101'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/media/ani-rss
      target: /config
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/homes/guangluo/entertainments
      target: /entertainments
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/media/workflow/DOWNLOADS
      target: /fms-downloads
      bind: {}

  qbittorrent:
    command: null
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: '4294967296'
      placement: {}
    dns:
    - 172.30.61.1
    entrypoint: null
    environment:
      PGID: '0'
      PUID: '0'
      TZ: Asia/Shanghai
      UMASK_SET: '18'
    image: sha256:efb22a75fb321baaebaf837c53037e5de363845251f169aae6d3cb5fc0e74e6c
    mac_address: 02:42:c0:a8:0a:06
    networks:
      qb_control:
        ipv4_address: 172.30.61.2
      qb_direct_lan:
        ipv4_address: 192.168.10.6
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/media/qbittorrent/config
      target: /config
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/media/qbittorrent/downloads
      target: /downloads
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/homes/guangluo/entertainments
      target: /entertainments
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/media/workflow/DOWNLOADS
      target: /fms-downloads
      bind: {}

  sublarr:
    command: null
    container_name: media-sublarr
    entrypoint: null
    environment:
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      UMASK: '022'
    image: abrechen2/sublarr:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    mem_limit: '1073741824'
    memswap_limit: '1073741824'
    networks:
      homelab_application_default: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 5765
      published: '5765'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/media/sublarr/config
      target: /config
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/homes/guangluo/entertainments
      target: /media
      bind:
        create_host_path: true

  emby:
    command: null
    container_name: media-emby
    entrypoint: null
    environment:
      GID: '100'
      GIDLIST: '0'
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      UID: '1026'
      UMASK: '022'
    image: emby/embyserver:4.10.2.0
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    mem_limit: '2147483648'
    memswap_limit: '2147483648'
    networks:
      homelab_application_default: null
    ports:
    - mode: ingress
      host_ip: 0.0.0.0
      target: 8096
      published: '6100'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/media/emby/config
      target: /config
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/homes/guangluo/entertainments/Media
      target: /media
      read_only: true
      bind:
        create_host_path: true

networks:
  homelab_application_default:
    name: homelab_application_default
    external: true
  qb_control:
    name: qb_control
    external: true
  qb_direct_lan:
    name: qb_direct_lan
    external: true

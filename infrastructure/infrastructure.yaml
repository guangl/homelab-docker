name: homelab_infrastructure

# 基础设施：PostgreSQL（Immich 数据库）+ Redis
# 端口：65432 → PostgreSQL 5432；6379 → Redis 6379
# Immich 通过 192.168.10.5:65432 与 192.168.10.5:6379 访问本机服务
# 约定：容器路径相对本文件，运行时数据目录已在 .gitignore 中排除
# 部署：docker compose --env-file .env -f infrastructure/infrastructure.yaml up -d

services:
  postgres:
    image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3-pgvectors0.3.0
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在仓库根 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./postgresql/initdb:/docker-entrypoint-initdb.d
    ports:
      - 65432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

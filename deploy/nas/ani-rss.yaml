name: homelab_application
networks:
  default:
    name: homelab_application_default
    ipam: {}
    external: false
  qb_control:
    external: true
services:
  ani-rss:
    command: null
    container_name: ani-rss
    deploy:
      resources:
        limits:
          memory: '268435456'
      placement: {}
    entrypoint: null
    environment:
      CONFIG: /config
      PGID: '100'
      PUID: '1026'
      SERVER_PORT: '9097'
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms64m -Xmx512m -Xss256k -XX:+UseG1GC -Djdk.tls.namedGroups=X25519,secp256r1,secp384r1
    image: wushuo894/ani-rss@sha256:4f32b1b536a427cb7110f52593c254d6d87880867c5a6a83cb4a7ea56d4949ee
    networks:
      default: null
      qb_control: null
    ports:
    - mode: ingress
      target: 9097
      published: '6101'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/application/ani-rss
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}
      target: /entertainments
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/application/family-media-system-runtime/DOWNLOADS
      target: /fms-downloads
      read_only: false
      bind:
        create_host_path: false

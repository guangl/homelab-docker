name: homelab_application
services:
  ani-rss:
    container_name: ani-rss
    deploy:
      resources:
        limits:
          memory: '268435456'
    environment:
      CONFIG: /config
      JAVA_OPTS: -Xms64m -Xmx512m -Xss256k -XX:+UseG1GC -Djdk.tls.namedGroups=X25519,secp256r1,secp384r1
      PGID: '100'
      PUID: '1026'
      SERVER_PORT: '9097'
      TZ: Asia/Shanghai
    image: wushuo894/ani-rss@sha256:4f32b1b536a427cb7110f52593c254d6d87880867c5a6a83cb4a7ea56d4949ee
    networks:
      homelab_application_default: null
      qb_control: null
    ports:
    - mode: ingress
      target: 9097
      published: '6101'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/ani-rss
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}
      target: /entertainments
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/DOWNLOADS
      target: /fms-downloads
      bind:
        create_host_path: false
  qbittorrent:
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: '4294967296'
    dns:
    - 192.168.10.4
    environment:
      PGID: '0'
      PUID: '0'
      TZ: Asia/Shanghai
      UMASK_SET: '18'
    image: ghcr.io/hotio/qbittorrent@sha256:944b91832c8b34306d9197a581c9993813443d9d7e5c4bb0a32cf5fc148f7b36
    mac_address: 02:42:c0:a8:0a:06
    networks:
      qb_control:
        ipv4_address: 172.30.61.2
      qb_direct_lan:
        ipv4_address: 192.168.10.6
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/qbittorrent/config
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/qbittorrent/downloads
      target: /downloads
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}
      target: /entertainments
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/DOWNLOADS
      target: /fms-downloads
      bind:
        create_host_path: false
  sublarr:
    container_name: media-sublarr
    environment:
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      UMASK: '022'
    image: abrechen2/sublarr@sha256:d50a05cc127f5823934782cdc686b5cdcaee20573c7cf9eed0c5f87247e8b142
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    mem_limit: '1073741824'
    memswap_limit: '1073741824'
    networks:
      homelab_application_default: null
    ports:
    - mode: ingress
      host_ip: 127.0.0.1
      target: 5765
      published: '5765'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/sublarr/config
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}
      target: /media
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/sublarr-overrides/ass_utils.py
      target: /app/ass_utils.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/sublarr-overrides/embedded_extractor.py
      target: /app/services/embedded_extractor.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/sublarr-overrides/subtitle_automation_runner.py
      target: /app/services/subtitle_automation_runner.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/workflow/sublarr-overrides/config_singleton.py
      target: /app/config_singleton.py
      read_only: true
      bind:
        create_host_path: false
  emby:
    container_name: media-emby
    environment:
      GID: '100'
      GIDLIST: '0'
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      UID: '1026'
      UMASK: '022'
    image: emby/embyserver@sha256:7082c63b10a2fcb3805a7eaebba407d5723bc57c085c9f0b29b7d0a702765cc1
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    mem_limit: '2147483648'
    memswap_limit: '2147483648'
    networks:
      homelab_application_default: null
    ports:
    - mode: ingress
      host_ip: 0.0.0.0
      target: 8096
      published: '6100'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/media/emby/config
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}/Media
      target: /media
      read_only: true
      bind:
        create_host_path: false
networks:
  homelab_application_default:
    name: homelab_application_default
    external: true
  qb_control:
    name: qb_control
    external: true
  qb_direct_lan:
    name: qb_direct_lan
    external: true

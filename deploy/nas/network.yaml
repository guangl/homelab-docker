name: homelab_network
services:
  smartdns:
    image: pymumu/smartdns@sha256:8db964569ae6ffc7e9f06f0a516d496c49b6dfc9b1430a2c2e64e7a66c18f1b9
    container_name: smartdns
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: CST-8
    volumes:
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/smartdns/conf
      target: /etc/smartdns
      type: bind
      read_only: true
      bind:
        create_host_path: false
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/smartdns/conf/ca-certificates.crt
      target: /etc/ssl/certs/ca-certificates.crt
      type: bind
      read_only: true
      bind:
        create_host_path: false
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/smartdns/data
      target: /var/lib/smartdns
      type: bind
      bind:
        create_host_path: false
    mem_limit: 128m
    healthcheck:
      test:
      - CMD
      - nslookup
      - -type=A
      - home.guangluo.top
      - 127.0.0.1:6053
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  adguardhome:
    depends_on:
      smartdns:
        condition: service_healthy
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/adguardhome/work
      target: /opt/adguardhome/work
      type: bind
      bind:
        create_host_path: false
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/adguardhome/conf
      target: /opt/adguardhome/conf
      type: bind
      bind:
        create_host_path: false
    command: --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work
    deploy:
      resources:
        limits:
          memory: 512M
  network-gateway:
    image: ghcr.io/sagernet/sing-box@sha256:afbffd294c5eb3519cc7b4587299ef189bb0a2ca2f667cb6301fdb6b9bce9558
    container_name: network-gateway
    network_mode: host
    restart: unless-stopped
    command:
    - run
    - -c
    - /etc/sing-box/config.json
    volumes:
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/sing-box
      target: /etc/sing-box
      type: bind
      read_only: true
      bind:
        create_host_path: false
    - source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/network/sing-box/cache
      target: /var/lib/sing-box
      type: bind
      bind:
        create_host_path: false
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

name: homelab_maintenance
services:
  glance:
    container_name: glance
    deploy:
      resources:
        limits:
          memory: '268435456'
    environment:
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:?请在根 .env 中设置 ADGUARD_PASSWORD}
      ADGUARD_USERNAME: ${ADGUARD_USERNAME:?请在根 .env 中设置 ADGUARD_USERNAME}
      GLANCES_OPT: -w
      IMMICH_API_KEY: ${IMMICH_API_KEY:?请在根 .env 中设置 IMMICH_API_KEY}
      IMMICH_URL: http://192.168.10.5:6104
      EMBY_API_KEY: ${EMBY_API_KEY:?请在根 .env 中设置 EMBY_API_KEY}
      LANGUAGE: All
      PERIOD: past_24_hours
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
      UNIFI_API_KEY: ${UNIFI_API_KEY:?请在根 .env 中设置 UNIFI_API_KEY}
      WAQI_TOKEN: ${WAQI_TOKEN:?请在根 .env 中设置 WAQI_TOKEN}
    image: glanceapp/glance@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    networks:
      homelab_maintenance_default: null
    ports:
    - mode: ingress
      target: 8080
      published: '6001'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/dashboard/glance/config
      target: /app/config
      bind:
        create_host_path: false
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      bind:
        create_host_path: false
networks:
  homelab_maintenance_default:
    name: homelab_maintenance_default
    external: true

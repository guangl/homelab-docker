name: homelab_application
networks:
  qb_direct_lan:
    external: true
  qb_control:
    external: true
services:
  qbittorrent:
    command: null
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: '4294967296'
      placement: {}
    entrypoint: null
    environment:
      PGID: '0'
      PUID: '0'
      TZ: Asia/Shanghai
      UMASK_SET: '18'
    image: ghcr.io/hotio/qbittorrent@sha256:944b91832c8b34306d9197a581c9993813443d9d7e5c4bb0a32cf5fc148f7b36
    networks:
      qb_control:
        ipv4_address: 172.30.61.2
      qb_direct_lan:
        ipv4_address: 192.168.10.6
    ports: []
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/application/qbittorrent/config
      target: /config
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/application/qbittorrent/downloads
      target: /downloads
      bind:
        create_host_path: false
    - type: bind
      source: ${MEDIA_ROOT:-/volume1/homes/guangluo/entertainments}
      target: /entertainments
      bind:
        create_host_path: false
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/application/family-media-system-runtime/DOWNLOADS
      target: /fms-downloads
      read_only: false
      bind:
        create_host_path: false
    dns:
    - 172.30.61.1
    mac_address: 02:42:c0:a8:0a:06

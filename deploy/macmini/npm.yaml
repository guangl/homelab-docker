services:
  npm:
    image: jc21/nginx-proxy-manager@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 7001:81
    volumes:
    - type: bind
      source: ${NPM_ROOT:-/Users/guang/Projects/homelab_npm}/data/nginx-proxy-manager/data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ${NPM_ROOT:-/Users/guang/Projects/homelab_npm}/data/nginx-proxy-manager/letsencrypt
      target: /etc/letsencrypt
      bind:
        create_host_path: false
    environment:
      DISABLE_IPV6: 'true'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      npm_default: null
name: npm
networks:
  npm_default:
    name: npm_default
    external: true

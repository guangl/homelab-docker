- type: custom-api
  title: UniFi 网络
  cache: 1m
  options:
    key: ${UNIFI_API_KEY}
  template: |-
    {{ $key := .Options.StringOr "key" "" }}
    {{ $data := newRequest "https://192.168.10.1/proxy/network/api/stat/sites" | withHeader "X-API-KEY" $key | withAllowInsecure true | getResponse }}
    {{ if eq $data.Response.StatusCode 200 }}
      {{ range $data.JSON.Array "data" }}
        <div class="studio-network-header"><span class="studio-status-dot"{{ if ne (.String "health.#(subsystem=\"wan\").status") "ok" }} style="background:var(--color-negative)"{{ end }}></span><div><div class="studio-network-name">{{ .String "health.#(subsystem=\"wan\").gw_name" }}</div><div class="studio-network-caption">{{ if eq (.String "health.#(subsystem=\"wan\").status") "ok" }}互联网已连接{{ else }}WAN 状态异常{{ end }}</div></div></div>
        <div class="studio-metrics"><div><strong>{{ .Int "health.#(subsystem=\"lan\").num_user" }}</strong><span>有线设备</span></div><div><strong>{{ .Int "health.#(subsystem=\"wlan\").num_user" }}</strong><span>无线设备</span></div></div>
      {{ else }}<p>控制器未返回站点数据。</p>{{ end }}
    {{ else }}<p>网络统计暂不可用（HTTP {{ $data.Response.StatusCode }}）。</p>{{ end }}

- type: custom-api
  title: 元数据翻译
  css-class: homelab-monitor
  cache: 30s
  template: |-
    {{ $r := newRequest "http://media-arrival-status:7099/status.json" | getResponse }}
    {{ with $r }}
    {{ if eq .Response.StatusCode 200 }}
    <div class="flex justify-between text-center">
      <div><div class="color-highlight size-h3">{{ .JSON.String "state_label" }}</div><div class="size-h6">{{ .JSON.String "age_text" }}</div></div>
      <div><div class="color-highlight size-h3">{{ .JSON.Int "repaired_total" }}</div><div class="size-h6">累计已翻</div></div>
      <div><div class="color-highlight size-h3">{{ .JSON.Int "budget_today" }}/{{ .JSON.Int "budget_limit" }}</div><div class="size-h6">今日额度</div></div>
    </div>
    {{ if ne (.JSON.String "error_text") "" }}<p class="size-h6 color-negative">最近一次告警：{{ .JSON.String "error_text" }}</p>{{ end }}
    {{ else }}<p class="color-negative">翻译状态接口不可用（HTTP {{ .Response.StatusCode }}）</p>{{ end }}
    {{ end }}

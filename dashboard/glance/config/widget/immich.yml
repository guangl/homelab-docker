- type: custom-api
  title: 照片库
  cache: 1h
  url: http://192.168.10.5:6104/api/server/statistics
  headers:
    x-api-key: ${IMMICH_API_KEY}
    Accept: application/json
  template: |-
    {{ if eq .Response.StatusCode 200 }}
    <div class="studio-metrics photo-library-metrics">
      <div><strong>{{ .JSON.Int "photos" | formatNumber }}</strong><span>照片</span></div>
      <div><strong>{{ .JSON.Int "videos" | formatNumber }}</strong><span>视频</span></div>
    </div>
    <div class="photo-library-caption">每一帧，都是生活的存档。</div>
    {{ else }}<p>照片统计暂不可用，请检查 API 密钥及统计权限。</p>{{ end }}

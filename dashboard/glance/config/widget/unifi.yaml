- type: custom-api
  title: UniFi 网络概览
  cache: 1m
  allow-insecure: true
  url: https://192.168.10.1/proxy/network/api/stat/sites
  headers:
    X-API-KEY: ${UNIFI_API_KEY}
    Accept: application/json
  template: "<style>\n  .list-horizontal-text.no-bullets-unifi > *:not(:last-child)::after {\n      content: none !important;\n\
    \  }\n  .list-horizontal-text.no-bullets-unifi > *:not(:last-child) {\n    margin-right: 1em;\n  }\n</style>\n{{ range\
    \ .JSON.Array \"data\" }}\n  <div style=\"display:flex; align-items:center; gap:12px;\">\n    <div style=\"width:40px;\
    \ height:40px; flex-shrink:0; display:flex; justify-content:center; align-items:center; overflow:hidden;\">\n      <img\
    \ src=\"https://cdn.jsdelivr.net/gh/selfhst/icons/svg/ubiquiti-unifi-light.svg\" width=\"24\" height=\"24\" style=\"object-fit:contain;\"\
    >\n    </div>\n    <div style=\"flex-grow:1; min-width:0;\">\n      <a class=\"size-h4 block text-truncate color-highlight\"\
    >\n        {{ .String \"health.#(subsystem=\\\"wan\\\").gw_name\" }}\n        {{ if eq (.String \"health.#(subsystem=\\\
    \"wan\\\").status\") \"ok\" }}\n        <span\n          style=\"width: 8px; height: 8px; border-radius: 50%; background-color:\
    \ var(--color-positive); display: inline-block; vertical-align: middle;\"\n          data-popover-type=\"text\"\n    \
    \      data-popover-text=\"WAN Connected\"\n        ></span>\n        {{ else }}\n        <span\n          style=\"width:\
    \ 8px; height: 8px; border-radius: 50%; background-color: var(--color-negative); display: inline-block; vertical-align:\
    \ middle;\"\n          data-popover-type=\"text\"\n          data-popover-text=\"WAN Disconnected\"\n        ></span>\n\
    \        {{ end }}\n      </a>\n      <ul class=\"list-horizontal-text no-bullets-unifi\">\n        <li data-popover-type=\"\

- type: docker-containers
  title: 管理与监控
  css-class: homelab-services
  hide-by-default: true
  format-container-names: true
  running-only: false
  containers:
    glances:
      id: glances
      name: Glances
      description: 查看 NAS 的 CPU、内存、磁盘与进程资源使用情况。
      url: https://top.guangluo.top
      icon: si:htop
      hide: false
    adguardhome:
      id: adguardhome
      name: AdGuard Home
      description: 管理 DNS 过滤规则、查询记录与广告拦截统计。
      url: https://adguard.guangluo.top
      icon: si:adguard
      hide: false
    uptime-kuma:
      id: uptime-kuma
      name: Uptime Kuma
      description: 站点与服务可用性监控，查看各监控项在线状态、响应时间与告警历史。
      url: https://monitor.guangluo.top
      icon: si:uptimekuma
      hide: false

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    container_name: immich-machine-learning
    restart: unless-stopped
    ports:
    - 3003:3003
    volumes:
    - type: bind
      source: ${ML_ROOT:-/Users/guang/immich-ml}/model-cache
      target: /cache
      bind:
        create_host_path: false
    environment:
      HF_HOME: /cache/hf-cache
      DEVICE: cpu
      MACHINE_LEARNING_CACHE_FOLDER: /cache
      MACHINE_LEARNING_WORKERS: '2'
      MACHINE_LEARNING_WORKER_TIMEOUT: '600'
      MACHINE_LEARNING_MODEL_ARENA: 'false'
      TRANSFORMERS_CACHE: /cache
    networks:
      immich-ml_default: null
name: immich-ml
networks:
  immich-ml_default:
    name: immich-ml_default
    external: true

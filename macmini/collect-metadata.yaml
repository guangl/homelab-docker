name: collect-metadata
services:
  db:
    image: postgres:17-bookworm
    pull_policy: never
    ports:
      - '0.0.0.0:15433:5432'
    env_file: ${MACMINI_HOMELAB_ROOT:-/Users/guang/dsh-data/homelab-migrate}/collect-metadata/db.env
    environment:
      POSTGRES_DB: collect_metadata
      POSTGRES_USER: collect_metadata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, collect_metadata, -d, collect_metadata]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
    external: true
    name: collect-metadata_postgres_data

name: homelab_maintenance
services:
  glances:
    container_name: glances
    deploy:
      resources:
        limits:
          memory: '134217728'
    environment:
      GLANCES_OPT: -w
      PGID: '100'
      PUID: '1026'
      TZ: Asia/Shanghai
    image: nicolargo/glances@sha256:413ddc0b03422ab0bcbf30f53faf63c3ee91b354bf544cd01aa60afa73a4cda2
    networks:
      homelab_maintenance_default: null
    pid: host
    ports:
    - mode: ingress
      target: 61208
      published: '6002'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
      bind:
        create_host_path: false
  uptime-kuma:
    container_name: uptime-kuma
    deploy:
      resources:
        limits:
          memory: '268435456'
    environment:
      TZ: Asia/Shanghai
    image: louislam/uptime-kuma@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    logging:
      driver: json-file
      options:
        max-file: '2'
        max-size: 5m
    networks:
      homelab_application_default: null
      homelab_maintenance_default: null
      qb_control: null
    ports:
    - mode: ingress
      target: 3001
      published: '6003'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${HOMELAB_ROOT:-/volume1/docker/homelab}/monitoring/uptime-kuma/data
      target: /app/data
      bind:
        create_host_path: false
networks:
  homelab_application_default:
    name: homelab_application_default
    external: true
  homelab_maintenance_default:
    name: homelab_maintenance_default
    external: true
  qb_control:
    name: qb_control
    external: true

- type: custom-api
  title: 照片库
  cache: 1h
  url: ${IMMICH_URL}/api/server/statistics
  headers:
    x-api-key: ${IMMICH_API_KEY}
    Accept: application/json
  template: |-
    {{ if eq .Response.StatusCode 200 }}
    <div class="flex justify-between text-center">
      <div><div class="color-highlight size-h3">{{ .JSON.Int "photos" | formatNumber }}</div><div class="size-h6">照片</div></div>
      <div><div class="color-highlight size-h3">{{ .JSON.Int "videos" | formatNumber }}</div><div class="size-h6">视频</div></div>
      <div><div class="color-highlight size-h3">{{ div (.JSON.Int "usage" | toFloat) 1073741824 | printf "%.1f" }}</div><div class="size-h6">GiB</div></div>
    </div>
    {{ else }}<p>照片统计暂不可用，请检查 API 密钥及统计权限。</p>{{ end }}

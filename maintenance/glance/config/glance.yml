branding:
  hide-footer: true
  app-name: 我的家庭主页
pages:
  - $include: home_page.yml
  - $include: homelab_page.yml
  - $include: development_page.yml
  - $include: photography_page.yaml

document:
  head: "<style>\n.homelab-clock [data-local-time] { flex-direction: column; align-items:\
    \ stretch; gap: 16px; }\n.homelab-clock [data-local-time] > div:first-child {\
    \ order: 2; display: flex; align-items: baseline; gap: 10px; }\n.homelab-clock\
    \ [data-local-time] > div:last-child { order: 1; text-align: left; }\n.homelab-clock\
    \ [data-local-time] [data-time] { font-size: clamp(40px, 4vw, 56px); line-height:\
    \ 1.15; font-weight: 600; letter-spacing: -0.03em; color: var(--color-highlight);\
    \ }\n.homelab-clock [data-weekday] { font-size: 16px; margin-top: 6px; }\n.homelab-clock\
    \ [data-date] { font-size: 20px; }\n.homelab-services .docker-container { align-items:\
    \ flex-start; }\n.homelab-services .docker-container > .min-width-0 > div.text-truncate\
    \ { white-space: normal; overflow: visible; text-overflow: clip; line-height:\
    \ 1.55; font-size: 14px; margin-top: 5px; }\n.homelab-background .docker-container-icon\
    \ { width: 20px; height: 20px; }\n.homelab-background .size-title-dynamic { font-size:\
    \ 14px; }\n.homelab-background .docker-container { gap: 10px; }\n.homelab-background\
    \ .dynamic-columns { gap: 12px; }\n.theme-choices, .current-theme-preview { display:\
    \ none !important; }\n</style>\n<script>\n(() => {\n  const preference = window.matchMedia('(prefers-color-scheme:\
    \ dark)');\n  let running = false;\n  const desired = () => preference.matches\
    \ ? 'default' : 'light';\n  async function syncTheme() {\n    if (running) return;\n\
    \    running = true;\n    try {\n      while (document.documentElement.dataset.theme\
    \ !== desired()) {\n        const key = desired();\n        const base = typeof\
    \ pageData === 'undefined' ? '' : pageData.baseURL;\n        const response =\
    \ await fetch(base + '/api/set-theme/' + key, {method: 'POST'});\n        if (!response.ok)\
    \ throw new Error('Theme update failed: ' + response.status);\n        const css\
    \ = await response.text();\n        if (key !== desired()) continue;\n       \
    \ const style = document.getElementById('theme-style');\n        if (!style) break;\n\
    \        style.textContent = css;\n        const scheme = response.headers.get('X-Scheme')\
    \ || (key === 'light' ? 'light' : 'dark');\n        document.documentElement.dataset.theme\
    \ = key;\n        document.documentElement.dataset.scheme = scheme;\n        document.documentElement.style.colorScheme\
    \ = scheme;\n        if (typeof pageData !== 'undefined') pageData.theme = key;\n\
    \        document.querySelector('meta[name=\"color-scheme\"]')?.setAttribute('content',\
    \ scheme);\n        document.querySelector('meta[name=\"theme-color\"]')?.setAttribute('content',\
    \ key === 'light' ? '#f5f5f7' : '#151519');\n      }\n    } catch (error) {\n\
    \      console.error('Automatic theme:', error);\n    } finally {\n      running\
    \ = false;\n    }\n  }\n  if (preference.addEventListener) preference.addEventListener('change',\
    \ syncTheme);\n  else preference.addListener(syncTheme);\n  window.addEventListener('focus',\
    \ syncTheme);\n  document.addEventListener('visibilitychange', () => { if (!document.hidden)\
    \ syncTheme(); });\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',\
    \ syncTheme, {once: true});\n  else syncTheme();\n})();\n\n</script>\n"
theme:
  disable-picker: false
  presets:
    light:
      light: true
      background-color: 240 10 97
      primary-color: 215 65 40
      positive-color: 135 50 30
      negative-color: 0 65 45

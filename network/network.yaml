# 每个功能目录仅保留同名 Compose 文件；密钥由根 .env 注入。
name: homelab_network

services:
  adguardhome:
    command:
    - --no-check-update
    - -c
    - /opt/adguardhome/conf/AdGuardHome.yaml
    - -w
    - /opt/adguardhome/work
    container_name: adguardhome
    depends_on:
      smartdns:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: '536870912'
      placement: {}
    entrypoint: null
    environment:
      TZ: Asia/Shanghai
    image: adguard/adguardhome:latest
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/network/adguardhome/work
      target: /opt/adguardhome/work
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/network/adguardhome/conf
      target: /opt/adguardhome/conf
      bind:
        create_host_path: true

  network-gateway:
    command:
    - run
    - -c
    - /etc/sing-box/config.json
    container_name: network-gateway
    entrypoint: null
    image: ghcr.io/sagernet/sing-box@sha256:afbffd294c5eb3519cc7b4587299ef189bb0a2ca2f667cb6301fdb6b9bce9558
    logging:
      driver: json-file
      options:
        max-file: '2'
        max-size: 5m
    mem_limit: '268435456'
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/network/sing-box
      target: /etc/sing-box
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/network/sing-box/cache
      target: /var/lib/sing-box
      bind:
        create_host_path: true

  smartdns:
    command: null
    container_name: smartdns
    entrypoint: null
    environment:
      TZ: CST-8
    healthcheck:
      test:
      - CMD
      - nslookup
      - -type=A
      - home.guangluo.top
      - 127.0.0.1:6053
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 5s
    image: pymumu/smartdns@sha256:8db964569ae6ffc7e9f06f0a516d496c49b6dfc9b1430a2c2e64e7a66c18f1b9
    mem_limit: '134217728'
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/docker/homelab/network/smartdns/conf
      target: /etc/smartdns
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/network/smartdns/conf/ca-certificates.crt
      target: /etc/ssl/certs/ca-certificates.crt
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /volume1/docker/homelab/network/smartdns/data
      target: /var/lib/smartdns
      bind:
        create_host_path: true

  tunnel:
    command:
    - -M
    - '0'
    - -NT
    - -p
    - '22'
    - -i
    - /run/ssh/id_ed25519
    - -o
    - BatchMode=yes
    - -o
    - IdentitiesOnly=yes
    - -o
    - StrictHostKeyChecking=yes
    - -o
    - UserKnownHostsFile=/run/ssh/known_hosts
    - -o
    - ExitOnForwardFailure=yes
    - -o
    - ServerAliveInterval=15
    - -o
    - ServerAliveCountMax=2
    - -o
    - ConnectTimeout=10
    - -R
    - 127.0.0.1:16001:192.168.10.5:6001
    - -R
    - 127.0.0.1:16106:192.168.10.5:6106
    - homelab-tunnel@82.156.50.189
    container_name: public-sites-tunnel
    entrypoint:
    - /usr/bin/autossh
    environment:
      AUTOSSH_GATETIME: '0'
      AUTOSSH_POLL: '30'
    image: jnovack/autossh@sha256:57a2117fc0498c374f66fef2199d186e2f11509e3ab35c62b5412644287edfaf
    logging:
      driver: json-file
      options:
        max-file: '2'
        max-size: 5m
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /volume1/homes/guangluo/cloud-relay/secrets
      target: /run/ssh
      read_only: true
      bind:
        create_host_path: true

# kill -HUP 1 重载配置文件

#########################################
# 基本设置
#########################################
bind 0.0.0.0:53

# 禁用 IPV6
force-AAAA-SOA yes

# 启用缓存，加速重复查询
cache-size 10240
cache-persist yes

#开启预取
prefetch-domain yes

#开启过期缓存
serve-expired yes

#禁用 SOA 65
force-qtype-SOA 65


# 日志输出（方便调试）
log-level info
log-file smartdns.log
log-size 64k
log-num 1

#########################################
# 上游 DNS 服务器
#########################################

# 国内上游
server 223.5.5.5
server 114.114.114.114

# 国外上游
server 8.8.8.8

# 启用测速模式，自动选择延迟最低的上游
# 可选模式：ping/tcp/tls/doh
speed-check-mode ping

# 禁止返回错误的 IP
prefetch-domain yes
dualstack-ip-selection yes

#########################################
# 本地域名解析（优先级最高）
#########################################

# 内网服务
address /nas.guangluo.top/192.168.10.5
address /adguard.guangluo.top/192.168.10.5
address /anime.guangluo.top/192.168.10.5
address /ddns.guangluo.top/192.168.10.5
address /download.guangluo.top/192.168.10.5
address /draw.guangluo.top/192.168.10.5
address /home.guangluo.top/192.168.10.5
address /monitor.guangluo.top/192.168.10.5
address /movie.guangluo.top/192.168.10.5
address /photo.guangluo.top/192.168.10.5
address /top.guangluo.top/192.168.10.5
address /db.guangluo.top/192.168.10.5


#########################################
# TTL & 优化
#########################################

# 设置最小 TTL，防止缓存过短频繁查询
rr-ttl-min 300
rr-ttl-max 86400

# 同时发起多个上游请求并取最快结果
serve-expired yes

name: homelab_tools

# 家庭工具层（6400-6499）：分析、导航、监控
# 端口：6400 umami、6402 grafana（prometheus / node-exporter 只在内网容器间）
# 依赖：infrastructure 层的 postgres（umami 用 postgresql://...@192.168.10.5:65432/umamidb）
# 部署：docker compose --env-file .env -f tools/tools.yaml up -d

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?请在仓库根 .env 中设置 POSTGRES_PASSWORD}@192.168.10.5:65432/umamidb
      APP_SECRET: ${UMAMI_APP_SECRET:?请在仓库根 .env 中设置 UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    ports:
      - 6400:3000
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在仓库根 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 局域网免密只读：匿名可查看面板，编辑/管理仍需 admin 登录（新版 Grafana OSS 已不支持匿名 Admin）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://192.168.10.5:6402/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 6402:3000
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    deploy:
      resources:
        limits:
          memory: 128M
